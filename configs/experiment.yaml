project:
  name: "bertweet_domain_finetuning_baseline_delta"
  output_dir: "outputs"
  seed: 42

model:
  base_model_name: "vinai/bertweet-base"
  task_type: "sequence_classification"
  num_labels: null
  max_length: 128

data:
  text_column: "text"
  label_column: "label"
  demographic_group_column: "demographic_group"
  perturbation_type_column: "perturbation_type"
  source_id_column: "source_id"
  baseline:
    train: "data/baseline/train.csv"
    valid: "data/baseline/valid.csv"
    test: "data/baseline/test.csv"
  domains:
    twitter:
      train: "data/twitter/train.csv"
      valid: "data/twitter/valid.csv"
      test: "data/twitter/test.csv"
    general:
      train: "data/general/train.csv"
      valid: "data/general/valid.csv"
      test: "data/general/test.csv"
  bias_eval: "data/bias/bias_eval.csv"
  robustness_eval: "data/robustness/robustness_eval.csv"

baseline:
  run_id: "B0"
  method: "full_ft"
  save_dir: "outputs/checkpoints/B0"

training:
  epochs: 3
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  gradient_accumulation_steps: 1
  fp16: true
  bf16: false
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "f1_macro"
  greater_is_better: true
  logging_steps: 50
  early_stopping_patience: 2

methods:
  full_ft:
    train_classifier_head: true
    train_all_base_params: true
  lora:
    train_classifier_head: true
    ranks: [8, 16, 32]
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules_strategy: "auto"
    include_attention_modules: true
    include_mlp_modules: false
  adapter:
    train_classifier_head: true
    bottleneck_size: 64
    nonlinearity: "gelu"
    placement: "after_transformer_layer_output"

experiment_matrix:
  domains: ["twitter", "general"]
  methods: ["full_ft", "lora", "adapter"]

evaluation:
  eval_sets:
    - "baseline_test"
    - "twitter_test"
    - "general_test"
    - "bias_eval"
    - "robustness_eval"
  metrics:
    - "accuracy"
    - "precision_macro"
    - "recall_macro"
    - "f1_macro"
    - "f1_weighted"
  compute_per_class_metrics: true
  compute_confusion_matrix: true

bias:
  enabled: true
  group_column: "demographic_group"
  compute_fpr_fnr_if_binary: true

domain_bias:
  enabled: true
  twitter_eval_name: "twitter_test"
  general_eval_name: "general_test"

robustness:
  enabled: true
  perturbation_column: "perturbation_type"
  compute_pairwise_if_source_id_exists: true

ranking:
  enabled: true
  weights:
    f1_macro: 0.40
    efficiency: 0.20
    robustness: 0.20
    fairness: 0.20
